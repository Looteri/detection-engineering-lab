name: Sigma Rule Validation

on:
  push:
    paths:
      - 'detections/sigma/**.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'tools/sigma-converter/convert_all.sh'
  pull_request:
    paths:
      - 'detections/sigma/**.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build

      - name: Run sigma conversion
        run: docker compose up --exit-code-from sigma-converter

      - name: Show converted rules
        run: ls -la detections/elastic/
