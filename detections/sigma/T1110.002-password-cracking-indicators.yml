title: SSH Login with Multiple Cracked Credentials - Credential Stuffing Indicator
id: 7d195ed3-bfc3-42c3-aaf6-8350d3c58576
status: experimental
description: >
  Detects multiple successful SSH authentications from a single source
  using different usernames — indicative of credential stuffing from
  a cracked hash list following /etc/shadow extraction.
references:
  - https://attack.mitre.org/techniques/T1110/002/
  - https://attack.mitre.org/techniques/T1078/
logsource:
  product: cowrie
  service: ssh
detection:
  selection:
    eventid: 'cowrie.login.success'
  timeframe: 5m
  condition: selection | count(username) by src_ip > 3
falsepositives:
  - Authorized admin testing multiple service accounts
level: high
tags:
  - attack.credential_access
  - attack.t1110.002
  - attack.t1078
fields:
  - src_ip
  - username
  - dest_port
