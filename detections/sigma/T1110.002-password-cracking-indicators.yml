title: SSH Login with Multiple Cracked Credentials - Credential Stuffing Indicator
id: 7d195ed3-bfc3-42c3-aaf6-8350d3c58576
status: experimental
description: >
  Detects successful SSH authentications indicative of credential stuffing
  following /etc/shadow extraction.
references:
  - https://attack.mitre.org/techniques/T1110/002/
logsource:
  product: cowrie
  service: ssh
detection:
  selection:
    eventid: 'cowrie.login.success'
  condition: selection
falsepositives:
  - Authorized admin testing multiple service accounts
level: high
tags:
  - attack.credential_access
  - attack.t1110.002
  - attack.t1078
fields:
  - src_ip
  - username
  - dest_port
